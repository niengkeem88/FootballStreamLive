<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Pulse Live - Sports Dashboard</title>
    <script type="module" src="https://widgets.api-sports.io/3.1.0/widgets.js"></script>
    <style>
        /* CSS Variables */
        :root {
            --color-bg-primary: #1e1e1e;
            --color-bg-secondary: #2a2a2a;
            --color-text-primary: #ffffff;
            --color-text-secondary: #b0b0b0;
            --color-border: #3a3a3a;
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --breakpoint-mobile: 768px;
            --breakpoint-tablet: 1024px;
        }

        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: var(--color-bg-primary);
            color: var(--color-text-primary);
            overflow: hidden;
        }

        /* Layout Container */
        .dashboard-container {
            display: grid;
            grid-template-columns: 60% 40%;
            gap: var(--spacing-md);
            padding: var(--spacing-md);
            height: 100vh;
            overflow: hidden;
        }

        /* Left Pane - Games List */
        .games-pane {
            display: flex;
            flex-direction: column;
            background-color: var(--color-bg-secondary);
            border-radius: 0.5rem;
            border: 1px solid var(--color-border);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .games-pane-header {
            padding: var(--spacing-md);
            border-bottom: 1px solid var(--color-border);
            flex-shrink: 0;
        }

        .games-pane-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--color-text-primary);
        }

        .games-pane-header p {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
            margin-top: 0.25rem;
        }

        .games-content {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-md);
        }

        /* Games Widget */
        .games-content api-sports-widget {
            display: block;
            width: 100%;
        }

        /* Right Pane - Game Details */
        .details-pane {
            background-color: var(--color-bg-secondary);
            border-radius: 0.5rem;
            border: 1px solid var(--color-border);
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
        }

        #game-details {
            width: 100%;
            height: 100%;
            padding: var(--spacing-md);
        }

        #game-details api-sports-widget {
            display: block;
            width: 100%;
        }

        .details-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--color-text-secondary);
            font-size: 0.875rem;
            text-align: center;
            padding: var(--spacing-md);
        }

        /* Scrollbar Styling */
        .games-pane::-webkit-scrollbar,
        .details-pane::-webkit-scrollbar {
            width: 0.5rem;
        }

        .games-pane::-webkit-scrollbar-track,
        .details-pane::-webkit-scrollbar-track {
            background: var(--color-bg-primary);
        }

        .games-pane::-webkit-scrollbar-thumb,
        .details-pane::-webkit-scrollbar-thumb {
            background: var(--color-border);
            border-radius: 0.25rem;
        }

        .games-pane::-webkit-scrollbar-thumb:hover,
        .details-pane::-webkit-scrollbar-thumb:hover {
            background: var(--color-text-secondary);
        }

        /* Tablet Responsiveness (768px - 1023px) */
        @media (max-width: 1023px) {
            .dashboard-container {
                grid-template-columns: 65% 35%;
                gap: var(--spacing-sm);
                padding: var(--spacing-sm);
            }

            .games-pane-header h1 {
                font-size: 1.25rem;
            }

            .games-content,
            #game-details {
                padding: var(--spacing-sm);
            }
        }

        /* Mobile Responsiveness (<768px) */
        @media (max-width: 767px) {
            .dashboard-container {
                grid-template-columns: 1fr;
                gap: 0;
                padding: 0;
                height: auto;
                overflow-y: auto;
            }

            .games-pane {
                height: auto;
                min-height: 100vh;
                border-radius: 0;
                border: none;
                border-bottom: 1px solid var(--color-border);
            }

            .games-pane-header {
                padding: var(--spacing-md);
            }

            .games-content {
                padding: var(--spacing-md);
            }

            /* Hide details pane on mobile by default */
            .details-pane {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                width: 100%;
                height: 100%;
                z-index: 1000;
                border-radius: 0;
                overflow-y: auto;
                overflow-x: hidden;
            }

            /* Show details pane when populated */
            .details-pane.active {
                display: block;
            }

            #game-details {
                height: auto;
                min-height: 100vh;
            }

            .games-pane-header h1 {
                font-size: 1.25rem;
            }

            .games-content,
            #game-details {
                padding: var(--spacing-md);
            }
        }

        /* Loading and Empty States */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
            color: var(--color-text-secondary);
        }

        .error {
            color: #ff6b6b;
            padding: var(--spacing-md);
            background-color: rgba(255, 107, 107, 0.1);
            border-radius: 0.5rem;
            border-left: 3px solid #ff6b6b;
        }
    </style>
</head>
<body>
    <!-- Dashboard Container -->
    <div class="dashboard-container">
        <!-- Left Pane: Games List -->
        <div class="games-pane">
            <div class="games-pane-header">
                <h1>Live Games</h1>
                <p>Select a game to view details</p>
            </div>
            <div class="games-content">
                <api-sports-widget data-type="games"></api-sports-widget>
            </div>
        </div>

        <!-- Right Pane: Game Details -->
        <div class="details-pane">
            <div id="game-details">
                <div class="details-empty">Select a game from the list to view details</div>
            </div>
        </div>
    </div>

    <!-- API-Sports Configuration Widget -->
    <api-sports-widget
        data-type="config"
        data-key="c87787f019e70ab9bd72d7391634e2b0"
        data-sport="football"
        data-lang="en"
        data-theme="grey"
        data-show-errors="true"
        data-target-game="#game-details"
        style="display: none;"
    ></api-sports-widget>
</body>
</html>
